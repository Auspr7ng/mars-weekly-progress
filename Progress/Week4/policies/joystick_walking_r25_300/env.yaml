          - r_shoulder_pitch
          - r_elbow_yaw
          - r_elbow_pitch
          - r_wrist_yaw
          - r_finger_slide_top
          - r_finger_slide_bottom
          - l_shoulder_roll
          - l_shoulder_pitch
          - l_elbow_yaw
          - l_elbow_pitch
          - l_wrist_yaw
          - l_finger_slide_bottom
          - l_finger_slide_top
          - r_hip_roll
          - r_hip_pitch
          - r_thigh_yaw
          - r_knee_roll
          - r_ankle_roll
          - r_ankle_pitch
          - l_hip_roll
          - l_hip_pitch
          - l_thigh_yaw
          - l_knee_roll
          - l_ankle_roll
          - l_ankle_pitch
          - head_rotation
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: null
          frictionloss: null
          viscous_damping: null
          delay_min_lag: 0
          delay_max_lag: 0
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          command_field: null
        soft_joint_pos_limit_factor: 0.9
      sort_actuators: false
      lights: !!python/tuple []
      cameras: !!python/tuple []
      textures: !!python/tuple []
      materials: !!python/tuple []
      collisions: !!python/tuple []
  sensors: !!python/tuple
  - name: feet_contact
    primary:
      mode: body
      pattern: ^[lr]_foot_link_1$
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    reduce: netforce
    num_slots: 1
    secondary_policy: first
    track_air_time: true
    global_frame: false
    history_length: 10
    debug: false
  - name: body_ground
    primary:
      mode: body
      pattern: ^(?![lr]_foot_link_1$|base_link$).*
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    reduce: netforce
    num_slots: 1
    secondary_policy: first
    track_air_time: false
    global_frame: false
    history_length: 0
    debug: false
  - name: self_collision

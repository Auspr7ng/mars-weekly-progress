          l_shoulder_pitch: 0.15
          l_elbow_yaw: 0.0
          l_elbow_pitch: 1.0
          l_wrist_yaw: 0.0
          l_finger_slide_bottom: 0.015
          l_finger_slide_top: 0.015
          r_hip_roll: 0.41706862423583246
          r_hip_pitch: 0.010979425929693372
          r_thigh_yaw: -0.2789843715947236
          r_knee_roll: 0.5100228055715467
          r_ankle_roll: 0.20716248240730534
          r_ankle_pitch: -0.056437182532283914

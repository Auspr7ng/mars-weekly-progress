        - &id001 !!python/name:sunday_locomotion.env_cfg.robot_spec ''
        state: !!python/tuple
        - *id001
        - !!python/tuple
          - null
        - {}
        - null
      articulation:
        actuators: !!python/tuple
        - target_names_expr: !!python/tuple

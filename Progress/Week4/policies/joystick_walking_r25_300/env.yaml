      mode: subtree
      pattern: base_link
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: subtree
      pattern: base_link
      entity: robot
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    reduce: none
    num_slots: 1
    secondary_policy: first
    track_air_time: false
    global_frame: false
    history_length: 0
    debug: false
